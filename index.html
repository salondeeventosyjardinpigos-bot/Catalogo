<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Catálogo PIGO'S — Flipbook</title>

  <!-- Tu CSS -->
  <link rel="stylesheet" href="styles.css"/>

  <!-- Fallback crítico por si el CSS externo tarda o falla -->
  <style>
    html,body{margin:0}
    .flipbook-root{width:100vw;height:100vh;overflow:hidden;background:#fff}
  </style>
</head>
<body>
  <div class="flipbook-root">
    <div id="book"></div>
  </div>

  <!-- Librería PageFlip (usa el nombre EXACTO que tengas en disco) -->
  <script src="page-flip.browser.min.js"></script>
  <!-- Si tu archivo real tiene GUION_BAJO, usa:
  <script src="page_flip.browser.min.js"></script>
  -->

  <!-- Tu script -->
  <script src="script.js"></script>
</body>

<body>

  <div class="flipbook-root">

  <!-- 3) Librería PageFlip: EL NOMBRE DEBE COINCIDIR CON TU ARCHIVO REAL -->

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Catálogo PIGO'S — Galería (Fallback rápido)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Catálogo PIGO'S</h1>
    <nav id="nav"></nav>

  <!-- Carril de "páginas" con scroll-snap, cada sección es una categoría -->

  <div class="lightbox" id="lb">
    <button class="lb-close" aria-label="Cerrar">×</button>
    <img class="lb-img" alt=""/>
  </div>

  <script src="app.js"></script>
</body>
</html>

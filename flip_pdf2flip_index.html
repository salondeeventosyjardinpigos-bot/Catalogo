<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Catálogo – Flip PDF (alta) + Índice (fondo) + Ver más</title>
  <style>
    html,body{margin:0;height:100%;background:#fff;overscroll-behavior:none}
    #book{width:100vw;height:100vh;background:#fff}

    /* Overlay de carga */
    .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;z-index:9}
    .bar{width:min(520px,80vw);height:10px;border-radius:10px;background:#eee;overflow:hidden;box-shadow:inset 0 0 0 1px #ddd}
    .bar>i{display:block;height:100%;width:0;background:#1F4E79;transition:width .2s}
    .msg{margin:14px 0 6px 0;font:14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;color:#334}
    .hint{font:12px/1.4 system-ui;color:#667}

    /* FAB Índice */
    .fab{position:fixed; right:14px; bottom:16px; z-index:50}
    .fab button{width:48px;height:48px;border-radius:50%;border:0;background:#1F4E79;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.35)}

    /* Panel del índice con FONDO */
    .panel{position:fixed; right:14px; bottom:76px; width:min(92vw, 380px); max-height:72vh; overflow:auto; border:1px solid #e7e9ef; border-radius:12px; box-shadow:0 14px 60px rgba(0,0,0,.3); display:none; z-index:60; background:transparent}
    .panel.open{display:block}
    .panel .bg{position:absolute; inset:0; background:#a00 center/cover no-repeat; filter:brightness(.75) saturate(.95); opacity:.98}
    .panel .inner{position:relative; z-index:1}
    .panel h3{margin:10px 12px 8px 12px; font:800 16px/1 system-ui; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.35)}
    .panel ul{list-style:none; padding:0 10px 12px 10px; margin:0; display:grid; gap:6px}
    .panel li{border:1px solid rgba(255,255,255,.3); border-radius:10px; backdrop-filter: blur(2px); overflow:hidden}
    .panel button.link{width:100%; text-align:left; padding:10px 12px; background:rgba(255,255,255,.88); border:0; border-radius:10px; cursor:pointer; font:800 14px/1.1 system-ui; color:#222}
    .panel button.link:hover{background:#fff}

    /* Botón VER MÁS (galería) */
    .more{position:fixed; left:14px; bottom:16px; z-index:50}
    .more button{height:48px; padding:0 14px; border-radius:999px; border:0; background:#fff; color:#1F4E79; font:800 14px system-ui; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,.35); border:1px solid #dde3ef}
    .more button[disabled]{opacity:.55; cursor:not-allowed}

    /* Galería por categoría */
    .gallery{ position:fixed; inset:0; background:rgba(0,0,0,.8); display:none; z-index:70; align-items:center; justify-content:center; padding:18px; overflow:auto }
    .gallery.open{ display:flex }
    .gal-wrap{ width:min(1100px, 96vw); background:#fff; border-radius:12px; box-shadow:0 18px 80px rgba(0,0,0,.55); padding:14px }
    .gal-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px }
    .gal-head h4{ margin:0; font:800 16px/1 system-ui; color:#1F4E79 }
    .gal-close{ width:40px;height:40px;border-radius:50%;border:0;background:#1F4E79;color:#fff;font-size:20px;cursor:pointer }
    .gal-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px }
    @media(min-width:740px){ .gal-grid{ grid-template-columns:repeat(3,1fr) } }
    @media(min-width:980px){ .gal-grid{ grid-template-columns:repeat(4,1fr) } }
    .gal-grid img{ width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:8px; background:#f6f8fb }
  </style>
</head>
<body>
  <div id="book"></div>
  <div class="overlay" id="ov">
    <div class="msg" id="ovmsg">Preparando páginas en alta…</div>
    <div class="bar"><i id="ovbar"></i></div>
    <div class="hint">portrait=1 · landscape=2 — Usa el índice (☰) o "Ver más"</div>
  </div>

  <!-- Índice -->
  <div class="fab"><button id="btnIndex" title="Índice">☰</button></div>
  <div class="panel" id="panel">
    <div class="bg" id="panelBg"></div>
    <div class="inner">
      <h3>Índice</h3>
      <ul id="panelList"></ul>
    </div>
  </div>

  <!-- VER MÁS -->
  <div class="more"><button id="btnMore" title="Ver más">Ver más</button></div>

  <!-- Galería -->
  <div class="gallery" id="gallery">
    <div class="gal-wrap">
      <div class="gal-head">
        <h4 id="galTitle">Categoría</h4>
        <button class="gal-close" id="galClose" aria-label="Cerrar">×</button>
      </div>
      <div class="gal-grid" id="galGrid"></div>
    </div>
  </div>

  <!-- StPageFlip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
  <!-- PDF.js -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    const PDF_URL      = 'catalogo.pdf';
    const MANIFEST_URL = 'images/manifest.gallery.json';

    // Alta calidad desde el inicio
    const DPR = Math.min(2, window.devicePixelRatio || 1);
    const BASE_BOOST = 1.7;      // 1.4–1.8
    const BASE_MAX_W = 2300;     // 2000–2400
    const JPEG_QUALITY = 0.9;    // 0.88–0.92

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

    function isPortrait(){ return innerHeight >= innerWidth; }
    function baseDir(){ return location.pathname.split('/').filter(Boolean)[0]||''; }
    function toAbs(p){ return p.startsWith('/')? p : ('/'+baseDir()+'/'+p); }
    function renderWidthBase(){ const cssOne = isPortrait()? innerWidth : Math.floor(innerWidth/2); const px = Math.round(cssOne * BASE_BOOST * DPR); return Math.min(px, BASE_MAX_W); }

    let PDF_DOC=null, IMG_URLS=[], pf=null, currentIndex=0, MANIFEST=null;

    async function loadManifest(){
      const r = await fetch(toAbs(MANIFEST_URL), { cache:'no-store' });
      if(!r.ok) throw new Error('No se pudo cargar manifest.gallery.json');
      return await r.json();
    }

    async function renderPdfToImages(url){
      PDF_DOC = await pdfjsLib.getDocument(toAbs(url)).promise;
      const count = PDF_DOC.numPages; const urls = [];
      for(let i=1;i<=count;i++){
        const page = await PDF_DOC.getPage(i);
        const v1 = page.getViewport({ scale: 1 });
        const scl = renderWidthBase() / v1.width;
        const v = page.getViewport({ scale: scl });
        const cv = document.createElement('canvas'); cv.width = Math.floor(v.width); cv.height = Math.floor(v.height);
        const ctx = cv.getContext('2d', { alpha:false, desynchronized:true });
        await page.render({ canvasContext: ctx, viewport: v }).promise;
        const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', JPEG_QUALITY));
        urls.push(URL.createObjectURL(blob));
        const bar=document.getElementById('ovbar'), msg=document.getElementById('ovmsg');
        if(bar) bar.style.width = Math.round((i/count)*100)+'%';
        if(msg) msg.textContent = `Preparando páginas en alta… ${i}/${count}`;
      }
      return urls;
    }

    function createFlip(images){
      IMG_URLS = images.slice();
      const useP=isPortrait(); const w=useP? innerWidth: Math.floor(innerWidth/2); const h=innerHeight;
      pf = new St.PageFlip(document.getElementById('book'), { size:'fixed', width:w, height:h, showCover:true, usePortrait:useP, mobileScrollSupport:true, flippingTime:900, drawShadow:true, maxShadowOpacity:0.18 });
      pf.loadFromImages(IMG_URLS);
      try{ pf.on('flip', e=>{ currentIndex = e.data; updateMoreState(); }); }catch(_){ }
      setTimeout(()=>{ try{pf.update(); updateMoreState();}catch(_){} }, 240);
      let t; addEventListener('resize', ()=>{ clearTimeout(t); t=setTimeout(()=>{ const p=isPortrait(); try{ pf.update({ width: p? innerWidth: Math.floor(innerWidth/2), height: innerHeight }); }catch(_){} },120); }, {passive:true});

      // Índice con fondo
      const btnIndex=document.getElementById('btnIndex'); const panel=document.getElementById('panel'); const list=document.getElementById('panelList'); const panelBg=document.getElementById('panelBg');
      btnIndex.addEventListener('click', ()=> panel.classList.toggle('open'));
      if(MANIFEST?.indexImage){ panelBg.style.backgroundImage = `url('${toAbs(MANIFEST.indexImage)}')`; }
      list.innerHTML='';
      for(const name of Object.keys(MANIFEST.categories||{})){
        const li=document.createElement('li'); const b=document.createElement('button'); b.className='link'; b.textContent = name;
        b.addEventListener('click', ()=>{ panel.classList.remove('open'); const pStr = Object.entries(MANIFEST.pageToCategory||{}).find(([pg,cat])=>cat===name)?.[0]; if(pStr){ try{ pf.turnToPage(parseInt(pStr,10)-1); }catch(_){} } });
        li.appendChild(b); list.appendChild(li);
      }

      // VER MÁS → galería de la categoría actual
      const btnMore=document.getElementById('btnMore'); const gallery=document.getElementById('gallery'); const galTitle=document.getElementById('galTitle'); const galGrid=document.getElementById('galGrid'); const galClose=document.getElementById('galClose');
      btnMore.addEventListener('click', ()=>{ const p1=(currentIndex+1).toString(); const cat=(MANIFEST.pageToCategory||{})[p1]; if(!cat) return; const imgs=(MANIFEST.categories||{})[cat]||[]; if(!imgs.length) return; galTitle.textContent=cat; galGrid.innerHTML=''; imgs.forEach(src=>{ const img=document.createElement('img'); img.loading='lazy'; img.src=toAbs(src); galGrid.appendChild(img); }); gallery.classList.add('open'); });
      function updateMoreState(){ const p1=(currentIndex+1).toString(); const cat=(MANIFEST.pageToCategory||{})[p1]; btnMore.disabled = !cat || !(MANIFEST.categories||{})[cat]?.length; }
      galClose.addEventListener('click', ()=> gallery.classList.remove('open'));
      gallery.addEventListener('click', e=>{ if(e.target===gallery) gallery.classList.remove('open'); });
      window.addEventListener('keydown', e=>{ if(e.key==='Escape' && gallery.classList.contains('open')) gallery.classList.remove('open'); }, true);
    }

    (async()=>{
      try{ MANIFEST = await loadManifest(); const imgs = await renderPdfToImages(PDF_URL); createFlip(imgs); document.getElementById('ov')?.remove(); }
      catch(e){ console.error(e); const m=document.getElementById('ovmsg'); if(m) m.textContent='No se pudo cargar catálogo o manifest'; }
    })();
  </script>
</body>
</html>

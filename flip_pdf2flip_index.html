<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Catálogo – Flip PDF (alta) + Índice</title>
  <style>
    html,body{margin:0;height:100%;background:#fff;overscroll-behavior:none}
    #book{width:100vw;height:100vh;background:#fff}

    /* Overlay de carga */
    .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;z-index:9}
    .bar{width:min(520px,80vw);height:10px;border-radius:10px;background:#eee;overflow:hidden;box-shadow:inset 0 0 0 1px #ddd}
    .bar>i{display:block;height:100%;width:0;background:#1F4E79;transition:width .2s}
    .msg{margin:14px 0 6px 0;font:14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;color:#334}
    .hint{font:12px/1.4 system-ui;color:#667}

    /* FAB Índice */
    .fab{position:fixed; right:14px; bottom:16px; z-index:50}
    .fab button{width:48px;height:48px;border-radius:50%;border:0;background:#1F4E79;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.35)}

    /* Panel del índice */
    .panel{position:fixed; right:14px; bottom:76px; width:min(90vw, 360px); max-height:70vh; overflow:auto; background:#fff; border:1px solid #e7e9ef; border-radius:12px; box-shadow:0 14px 60px rgba(0,0,0,.3); display:none; z-index:60}
    .panel.open{display:block}
    .panel h3{margin:12px 12px 8px 12px; font:700 16px/1 system-ui; color:#1F4E79}
    .panel ul{list-style:none; padding:0 10px 10px 10px; margin:0; display:grid; gap:6px}
    .panel li{border:1px solid #e9ecf3; border-radius:10px}
    .panel button.link{width:100%; text-align:left; padding:10px 12px; background:#fff; border:0; border-radius:10px; cursor:pointer; font:600 14px/1.1 system-ui; color:#223}
    .panel button.link:hover{background:#f6f8fb}
  </style>
</head>
<body>
  <div id="book"></div>
  <div class="overlay" id="ov">
    <div class="msg" id="ovmsg">Preparando páginas en alta…</div>
    <div class="bar"><i id="ovbar"></i></div>
    <div class="hint">portrait=1 página · landscape=2 páginas</div>
  </div>

  <!-- Índice -->
  <div class="fab"><button id="btnIndex" title="Índice">☰</button></div>
  <div class="panel" id="panel"><h3>Índice</h3><ul id="panelList"></ul></div>

  <!-- StPageFlip -->
  https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js</script>
  <!-- PDF.js -->
  https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js</script>
  <script>
    // ===== Configuración =====
    const PDF_URL    = 'catalogo.pdf';  // coloca tu PDF con este nombre o cambia la ruta
    const INDEX_PAGE = 2;               // página (1-based) del índice dentro del PDF

    // Mapa Categoría -> Página (1-based). Ajusta si tu export cambia el orden.
    const INDEX_MAP = {
      'Mantelería':       3,
      'Pasto sintético':  4,
      'Carpas':           5,
      'Charcutería':      6,
      'Desayunos':        8,
      'Mobiliario':       9,
      'Tapes':            10,
      'Café':             11,
      'Jardín':           12,
      'Salón':            13,
      'Mesa de dulces':   14,
      'Salas':            15,
      'Platos base':      16,
      'Copas':            17,
      'Pista LED':        18,
      'Inflables':        19,
      'Sillones':         20,
      'Mesa de novios':   21,
      'Letras':           22,
      'Ubicación':        23
    };

    // === PDF.js worker ===
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

    // ===== Alta calidad desde el inicio (ajustable) =====
    const DPR          = Math.min(2, window.devicePixelRatio || 1);
    const BASE_BOOST   = 1.6;     // mayor valor = más detalle (y más peso)
    const BASE_MAX_W   = 2200;    // tope de ancho renderizado por página
    const JPEG_QUALITY = 0.9;     // 0.85–0.92 recomendado

    function isPortrait(){ return innerHeight >= innerWidth; }
    function renderWidthBase(){
      const cssOne = isPortrait()? innerWidth : Math.floor(innerWidth/2);
      const px     = Math.round(cssOne * BASE_BOOST * DPR);
      return Math.min(px, BASE_MAX_W);
    }

    let PDF_DOC=null, IMG_URLS=[], pf=null, currentIndex=0;

    // Renderiza TODO el PDF a imágenes en alta (sin zoom ni re-render posterior)
    async function renderPdfToImages(url){
      PDF_DOC = await pdfjsLib.getDocument(url).promise;
      const count = PDF_DOC.numPages;
      const urls  = [];
      for(let i=1;i<=count;i++){
        const page = await PDF_DOC.getPage(i);
        const v1   = page.getViewport({ scale: 1 });
        const scl  = renderWidthBase() / v1.width;
        const v    = page.getViewport({ scale: scl });

        const cv   = document.createElement('canvas');
        cv.width   = Math.floor(v.width);
        cv.height  = Math.floor(v.height);
        const ctx  = cv.getContext('2d', { alpha:false, desynchronized:true });
        await page.render({ canvasContext: ctx, viewport: v }).promise;

        const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', JPEG_QUALITY));
        urls.push(URL.createObjectURL(blob));

        // progreso
        const bar=document.getElementById('ovbar'), msg=document.getElementById('ovmsg');
        if(bar) bar.style.width = Math.round((i/count)*100)+'%';
        if(msg) msg.textContent = `Preparando páginas en alta… ${i}/${count}`;
      }
      return urls;
    }

    function createFlip(images){
      IMG_URLS = images.slice();
      const useP=isPortrait(); const w=useP? innerWidth: Math.floor(innerWidth/2); const h=innerHeight;

      pf = new St.PageFlip(document.getElementById('book'), {
        size:'fixed', width:w, height:h, showCover:true, usePortrait:useP,
        mobileScrollSupport:true, flippingTime:900, drawShadow:true, maxShadowOpacity:0.18
      });
      pf.loadFromImages(IMG_URLS);

      try{ pf.on('flip', e=>{ currentIndex = e.data; }); }catch(_){}
      setTimeout(()=>{ try{pf.update();}catch(_){} }, 240);

      // Ajuste al cambiar orientación/tamaño
      let t; addEventListener('resize', ()=>{ clearTimeout(t); t=setTimeout(()=>{
        const p=isPortrait(); try{ pf.update({width: p? innerWidth: Math.floor(innerWidth/2), height: innerHeight}); }catch(_){}
      },120); }, {passive:true});

      // Índice flotante
      const btnIndex=document.getElementById('btnIndex'); const panel=document.getElementById('panel'); const list=document.getElementById('panelList');
      btnIndex.addEventListener('click', ()=> panel.classList.toggle('open'));
      list.innerHTML='';
      for(const [label, page1] of Object.entries(INDEX_MAP)){
        const li=document.createElement('li'); const b=document.createElement('button'); b.className='link';
        b.textContent = `${label} · p.${page1}`;
        b.addEventListener('click', ()=>{ panel.classList.remove('open'); try{ pf.turnToPage(page1-1); }catch(_){ } });
        li.appendChild(b); list.appendChild(li);
      }
    }

    (async()=>{
      try{ const imgs = await renderPdfToImages(PDF_URL); createFlip(imgs); document.getElementById('ov')?.remove(); }
      catch(e){ console.error(e); const m=document.getElementById('ovmsg'); if(m) m.textContent='No se pudo cargar catalogo.pdf'; }
    })();
  </script>
</body>
</html>

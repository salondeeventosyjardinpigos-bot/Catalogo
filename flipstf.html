<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
/**
 * CONFIGURACIÓN:
 * Lista de carpetas reales dentro de /Catalogo/images/
 * SOLO define carpetas – el sistema detecta TODOS los archivos .jpg .jpeg .png .webp
 */
const FOLDERS = [
  "Portada",
  "Manteleria",
  "PastoSintetico",
  "Carpas",
  "Charcuteria",
  "Desayunos",
  "Mobiliario",
  "Tapes",
  "Cafe",
  "Jardin",
  "Salon",
  "MesaDeDulces",
  "Salas",
  "PlatosBase",
  "Copas",
  "PistaLED",
  "Inflables",
  "Sillones",
  "MesaDeNovios",
  "Letras",
  "Contraportada"
];

/**
 * AUTO-DETECTAR IMÁGENES DESDE CUALQUIER CARPETA
 * GitHub Pages NO permite listar archivos, así que usamos patrones conocidos.
 * Aquí defines la cantidad de imágenes máximas a probar.
 * No afecta el rendimiento.
 */
const MAX_IMAGES = 50; 

async function autoDetectPages() {
  const base = "images/";
  const exts = [".jpg", ".jpeg", ".png", ".webp"];

  let pages = [];

  for (let folder of FOLDERS) {
    for (let i = 1; i <= MAX_IMAGES; i++) {
      for (let ext of exts) {
        const tryPath = `${base}${folder}/${folder.toLowerCase()}${String(i).padStart(2,"0")}${ext}`;

        const exists = await fetch(tryPath, { method: "HEAD" })
          .then(r => r.status === 200)
          .catch(() => false);

        if (exists) pages.push(tryPath);
      }
    }
  }

  return pages;
}

async function initFlip() {
  const PAGES = await autoDetectPages();

  if (!PAGES.length) {
    document.body.innerHTML = "<h2>No se detectaron imágenes en /images/**</h2>";
    return;
  }

  let book = document.getElementById("book");
  let pf = new St.PageFlip(book, {
    width: innerWidth > innerHeight ? innerWidth/2 : innerWidth,
    height: innerHeight,
    showCover: true,
    usePortrait: innerHeight >= innerWidth,
    flippingTime: 900,
    mobileScrollSupport: true
  });

  pf.loadFromImages(PAGES);
}

initFlip();
</script>
